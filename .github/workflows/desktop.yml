# The desktop app (desktop/), built unsigned on a Mac and on Windows, tried, and kept as this run's
# artifacts. Only by hand (Actions, desktop, Run workflow) or for a v* tag, never on every push:
# it takes a while, and checks.yml already checks the code.
#
# A tag (v0.1.0, matching desktop/package.json) also attaches the installers to a draft release,
# for anyone to download once the owner publishes it. GitHub counts each file's downloads
# (docs/apps.md says where to see them); nothing in the app reports anything back.
name: desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Actions are pinned to a commit, not a tag a compromised repo could move; Dependabot bumps them.
jobs:
  draft:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # electron-builder names the files from desktop/package.json, so the tag has to agree with it.
      - run: |
          version="$(node -p 'require("./desktop/package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error title=version::the tag is $TAG but desktop/package.json says $version"
            exit 1
          fi
          # A re-run (after fixing a secret, say) builds into the release that's already there.
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --verify-tag --title "Proxenos $TAG" --notes "$NOTES"
        env:
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: |
            Proxenos as an app, with nothing else to install and no terminal. Your records stay on your computer.

            **Install it**

            1. Download the file for your computer below, under Assets: the `.dmg` for a Mac with Apple silicon (macOS 13 or newer), or the `.exe` for Windows.
            2. Mac: open the `.dmg` and drag Proxenos into Applications. Windows: run the `.exe`.
            3. Open Proxenos. It isn't signed yet, so your computer warns you the first time. That's expected.
               - Mac: try to open it once. Then open System Settings, then Privacy & Security, scroll down, and press **Open Anyway** beside Proxenos.
               - Windows: when SmartScreen warns, press **More info**, then **Run anyway**.
            4. Follow the screens. Setup asks your name, where to keep your records, and which model should write for you. Its last screen is a checklist: do the lines you want now, and the rest later from **Connect**.

            You'll see Home, and a menu-bar icon (Mac) or tray icon (Windows). If a Mac says Proxenos "can't be opened", use **Open Anyway** as in step 3.

            Every step, with what you'll see: [Get started](https://github.com/mindemory/proxenos#get-started) and [the guide](https://github.com/mindemory/proxenos/blob/main/docs/guide.md#install-the-desktop-app).

  build:
    needs: [draft]
    # A run by hand has no draft to wait for; a tag's run builds only once its draft exists.
    if: ${{ !cancelled() && (needs.draft.result == 'success' || github.ref_type != 'tag') }}
    permissions:
      contents: write # to attach the installers to a tag's draft release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Git Bash on Windows, for build.sh
    env:
      PYTHONUTF8: "1"
    steps:
      # The scripts keep their LF line endings on Windows, so bash can run them.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      # The Google sign-in client the app ships with, from this repo's secrets when they're set;
      # without them the app builds without Google sign-in, as for anyone building it themselves.
      - run: desktop/build.sh
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      # The app's own Python writes a demo vault, and its page's server answers on it.
      - run: desktop/smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proxenos-${{ runner.os }}-unsigned
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
      - if: github.ref_type == 'tag'
        run: |
          shopt -s nullglob
          files=(desktop/dist/*.dmg desktop/dist/*.zip desktop/dist/*.exe)
          gh release upload "$TAG" "${files[@]}" --clobber
        env:
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
