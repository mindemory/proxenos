# The desktop app (desktop/), built unsigned on a Mac and on Windows, tried, and kept as this run's
# artifacts. Only by hand (Actions, desktop, Run workflow) or for a v* tag, never on every push:
# it takes a while, and checks.yml already checks the code.
name: desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Actions are pinned to a commit, not a tag a compromised repo could move; Dependabot bumps them.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Git Bash on Windows, for build.sh
    env:
      PYTHONUTF8: "1"
    steps:
      # The scripts keep their LF line endings on Windows, so bash can run them.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - run: desktop/build.sh
      # The app's own Python writes a demo vault, and its page's server answers on it.
      - run: desktop/smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proxenos-${{ runner.os }}-unsigned
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
