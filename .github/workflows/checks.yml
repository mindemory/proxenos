# The same checks as CONTRIBUTING.md, on every push and every pull request. The README's badge
# follows main only, so a branch trying something out can't turn it red.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    # Proxenos runs on macOS today and on Windows next (docs/apps.md), so its tests run on both.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"  # how the app and the scheduler run Python, so files read as UTF-8 on Windows too
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q --junitxml=pytest.xml
      # Every failing test with the end of its error, in one annotation: anyone can read it without
      # signing in, and GitHub shows only the first ten annotations of a step.
      - if: failure()
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          lines = []
          for case in ET.parse("pytest.xml").iter("testcase"):
              for bad in case.findall("failure") + case.findall("error"):
                  text = (bad.text or bad.get("message") or "").strip().splitlines()
                  tail = " | ".join(line.strip() for line in text[-3:])[:300]
                  lines.append(f"{case.get('name')}: {tail}")
          print("::error title=failing tests::" + "%0A".join(lines).replace("::", ": :"))

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p .
      - run: npm run build
