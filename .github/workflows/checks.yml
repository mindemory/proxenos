# The same checks as CONTRIBUTING.md, on every push and every pull request. The README's badge
# follows main only, so a branch trying something out can't turn it red.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    # Proxenos runs on macOS today and on Windows next (docs/apps.md), so its tests run on both.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q --junitxml=pytest.xml
      # Name each failing test as an annotation, which anyone can read without signing in.
      - if: failure()
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          for case in ET.parse("pytest.xml").iter("testcase"):
              for bad in case.findall("failure") + case.findall("error"):
                  first = (bad.get("message") or "").splitlines()[0][:300] if bad.get("message") else ""
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{first}")

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p .
      - run: npm run build
