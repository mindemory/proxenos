[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proxenos"
version = "0.1.0"
description = "Proxenos: acts on my behalf, from a model of me that keeps learning from my own data."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3",
    "pypdf>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
proxenos = "proxenos.cli:main"
px = "proxenos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/proxenos"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
