[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "digital-twin"
version = "0.1.0"
description = "A digital twin of me that keeps learning from my data."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
twin = "twin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/twin"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
