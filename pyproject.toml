[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proxenos"
version = "0.1.0"
description = "Proxenos: acts on your behalf, from a model of you that keeps learning from your own data."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4.0",
    # Windows Credential Manager, for secrets (keychain.py). Macs use `security`; on Linux the
    # Secret Service is used when keyring is installed.
    "keyring>=25.7.0; sys_platform == 'win32'",
    "numpy>=2.5.4",
    "pdfminer.six>=20260107",  # where a flat PDF form's labels and lines sit (forms.py)
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "tzdata; sys_platform == 'win32'",  # zoneinfo has no time zones of its own on Windows
    "vaderSentiment>=3.3.2",  # the valence of the user's own writing, with no model (mood.py)
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
# A model the desktop app runs itself, with no Ollama (proxenos.localmodel): mlx-lm on a Mac with
# Apple silicon, which serves Gemma 4 from Hugging Face's weights. desktop/build.sh installs it.
local = [
    "mlx-lm>=0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Listen's natural voice and the user's own (proxenos.speech), made with MLX on a Mac with Apple
# silicon. Kokoro reads text as sounds with misaki, which needs spaCy's small English model and
# espeak-ng (GPL-3.0, through phonemizer-fork and espeakng-loader) for words not in its
# dictionary; all are installed into the env, none is part of Proxenos (ACKNOWLEDGMENTS.md).
speech = [
    "mlx-audio>=0.6.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "misaki>=0.9.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "spacy>=3.8.18,<3.9; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "num2words>=0.5.14; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "phonemizer-fork>=3.3.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "espeakng-loader>=0.2.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
proxenos = "proxenos.cli:main"
px = "proxenos.cli:main"

[tool.hatch.metadata]
allow-direct-references = true  # spaCy's English model, in the speech extra, isn't on PyPI

[tool.hatch.build.targets.wheel]
packages = ["src/proxenos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test this checkout's code, even when the editable install points at another one.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
